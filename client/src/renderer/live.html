<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <!-- Room Live үзэгчийн цонх (2026-10-03): LiveKit SFU-ээс урсгал татна. CSP: Датаком SFU-ийн ws/wss. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src 'self' blob: mediastream:; connect-src 'self' ws://202.131.1.136:* wss://202.131.1.136:* ws://*.garena.mn:* wss://*.garena.mn:* wss://*.sslip.io:*;" />
  <title>Live — Garena.mn</title>
  <style>
    :root { --bg: #0b0b12; --panel: #14141f; --line: rgba(255,255,255,.08); --text: #f1f1f5; --muted: #9a9ab0; --red: #e63946; --green: #3fae4a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    .top { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .top .live { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 6px; background: var(--red); color: #fff; font-weight: 800; font-size: 11.5px; letter-spacing: .4px; }
    .top .live i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .top b { font-size: 14px; }
    .top .sep { color: var(--muted); }
    .top .viewers { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 6px; background: rgba(255,255,255,.07); font-weight: 700; font-variant-numeric: tabular-nums; }
    .top .viewers.full { background: rgba(230,57,70,.25); color: #ffb3b9; }
    .top .q { color: var(--muted); font-size: 12px; }
    .top .sp { flex: 1; }
    .top button { -webkit-app-region: no-drag; background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
    .top button:hover { background: rgba(255,255,255,.08); }
    .stage { position: absolute; inset: 44px 0 0 0; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .msg { position: absolute; inset: 44px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 15px; pointer-events: none; }
    .msg.hidden { display: none; }
    .msg b { color: var(--text); font-size: 18px; }
    .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--red); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { position: absolute; left: 12px; bottom: 10px; color: rgba(255,255,255,.55); font-size: 11.5px; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
    .stats { position: absolute; right: 12px; bottom: 10px; color: rgba(255,255,255,.55); font-size: 11.5px; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; pointer-events: none; }
  </style>
</head>
<body>
  <div class="top">
    <span class="live"><i></i>LIVE</span>
    <b id="streamer">…</b>
    <span class="sep">·</span>
    <span class="viewers" id="viewers" title="Одоо үзэж байгаа / дээд хязгаар">👁 <span id="v-now">0</span> / <span id="v-max">35</span> үзэгч</span>
    <span class="q" id="quality">720p · 30fps</span>
    <span class="sp"></span>
    <button type="button" id="btn-mute" title="Дуу">🔊</button>
    <button type="button" id="btn-full" title="Дэлгэц дүүрэн (F)">⛶</button>
    <button type="button" id="btn-close" title="Хаах">✕</button>
  </div>
  <div class="stage"><video id="video" autoplay playsinline></video></div>
  <div class="msg" id="msg"><div class="spin"></div><span id="msg-text">Холбогдож байна…</span></div>
  <div class="foot" id="foot">Нэг LAN тоглоомд байгаа хүн энэ Live-ийг үзэх боломжгүй</div>
  <div class="stats" id="stats"></div>
  <script src="vendor/livekit-client.umd.js"></script>
  <script src="live-viewer.js"></script>
</body>
</html>
